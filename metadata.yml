Slug: druglikeness-unsupervised
Status: Ready
Title: Drug-likeness scoring based on unsupervised learning
Description: Rates how closely a molecule resembles compounds that have progressed
  through drug development, on a scale where FDA-approved drugs average 79.4, ChEMBL
  compounds 64.1 and GDB-17 structures 39.4. Lee and colleagues trained a recurrent
  language model on known drugs alone, sidestepping the need for a negative set, since
  compounds labelled non-drug are usually just untested. The score reflects resemblance
  to developed chemistry and should not be read as a prediction of efficacy or safety.
