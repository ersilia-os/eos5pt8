Title: Drug-likeness scoring based on unsupervised learning
Description: Rates how closely a molecule resembles compounds that have progressed
  through drug development, on a scale that tops out at 100 and on which the published
  model averaged 79.4 for FDA-approved drugs, 64.1 for ChEMBL and 39.4 for GDB-17
  structures. Lee and colleagues trained a recurrent language model on known drugs
  alone, sidestepping the need for a negative set, since compounds labelled non-drug
  are usually just untested. Ersilia serves the authors' later extended checkpoint,
  retrained on an updated drug database. Very short SMILES score spuriously high.
